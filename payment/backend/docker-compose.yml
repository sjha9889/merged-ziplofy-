# Optional: local MongoDB for development
# From backend/: docker compose up -d
# Then use MONGODB_URI=mongodb://127.0.0.1:27017/payment-gateway in .env

services:
  mongodb:
    image: mongo:7
    container_name: payment-gateway-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - payment_mongo_data:/data/db

volumes:
  payment_mongo_data:
